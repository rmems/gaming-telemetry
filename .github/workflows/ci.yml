name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PRs share one group per PR so superseded runs cancel. Pushes to main get a
  # per-commit group: GitHub drops *pending* runs in a shared group even with
  # cancel-in-progress off, which would skip CI for intermediate commits.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
          toolchain: "1.98.0"
      - name: MSRV pin matches Cargo.toml
        # The toolchain version lives in Cargo.toml, rust-toolchain.toml, the Amp
        # setup script, and every job below. Parse the workflow as YAML rather than
        # pattern-matching it: a regex keyed to one quoting style silently skips
        # `toolchain: stable` or `toolchain: 'stable'`, and the guard then passes on
        # the entries it did match -- failing open exactly when a job has drifted.
        run: |
          set -euo pipefail
          python3 - <<'GUARD'
          import re, sys
          try:
              import yaml
          except ImportError:
              sys.exit("::error::PyYAML unavailable; the MSRV guard cannot verify anything")

          def scalar(path, pattern):
              text = open(path, encoding="utf-8").read()
              found = re.search(pattern, text, re.MULTILINE)
              if not found:
                  sys.exit(f"::error::no {pattern!r} in {path}")
              return found.group(1)

          declared = scalar("Cargo.toml", r'^rust-version\s*=\s*"([^"]+)"')
          pinned = scalar("rust-toolchain.toml", r'^channel\s*=\s*"([^"]+)"')
          setup = scalar(".agents/setup", r'^RUST_TOOLCHAIN="([^"]+)"')
          print(f"Cargo.toml rust-version={declared}  rust-toolchain.toml channel={pinned}  .agents/setup={setup}")
          if len({declared, pinned, setup}) != 1:
              sys.exit(
                  f"::error::MSRV drift: Cargo.toml {declared}, "
                  f"rust-toolchain.toml {pinned}, .agents/setup {setup}"
              )

          workflow = yaml.safe_load(open(".github/workflows/ci.yml", encoding="utf-8"))
          pins = [
              (job, str(step["with"]["toolchain"]))
              for job, body in (workflow.get("jobs") or {}).items()
              for step in (body.get("steps") or [])
              if isinstance(step.get("with"), dict) and "toolchain" in step["with"]
          ]
          if not pins:
              sys.exit("::error::no toolchain pins found; the guard would pass vacuously")

          print(f"checked {len(pins)} job pin(s)")
          drifted = [(job, pin) for job, pin in pins if pin != declared]
          if drifted:
              for job, pin in drifted:
                  print(f"::error::job {job} pins {pin!r} but Cargo.toml declares {declared}")
              sys.exit(1)
          GUARD
      - name: rustfmt
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,llvm-tools-preview
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.3
        with:
          shared-key: clippy-all-features
      - name: clippy
        # --all-features so the optional `query` code is linted too.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  check-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.3
        with:
          shared-key: check-strict
      - name: Cargo check (default features)
        run: cargo check --locked
      - name: Cargo check (strict -D warnings, all features)
        run: RUSTFLAGS="-D warnings" cargo check --locked --all-features

  # The Windows CPU backend (windows-sys file mapping, mutex, probe dispatch)
  # is `#[cfg(windows)]` — Linux jobs never compile it. This job exists so the
  # Windows-only path is built and tested on every PR, not just the portable
  # parsers that run under cfg(test) on Linux. Default features only: the
  # `query` feature's bundled-DuckDB C++ build would dominate the job.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.3
        with:
          shared-key: windows-default
      - name: Cargo check (default features)
        run: cargo check --locked
      - name: clippy (default features)
        # The Linux clippy job never compiles `#[cfg(windows)]` code.
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (default features)
        run: cargo test --locked

  test-default:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Qlty coverage upload (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.3
        with:
          shared-key: test-default
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: grcov
      - name: Test
        run: cargo test --locked
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-C instrument-coverage"
      - name: Generate lcov.info
        run: |
          grcov . -s . --binary-path ./target/debug -t lcov --branch --ignore-not-existing --ignore build.rs -o lcov.info
          test -s lcov.info
          ! grep -q '^SF:build.rs$' lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@cd8b657745c0c7bb7f101e61a61c9ed5d74b8561 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
      - name: Upload coverage to Qlty
        # Fork PRs get no OIDC token; pushes to main still upload.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@10ccbe4bf74e9f71f24c9266a87f34265011ac1f # v2.7.0
        with:
          oidc: true
          files: lcov.info

  # `--all-features` alone never builds the tests for the default (no-`query`)
  # build that operators actually run, so both configurations are tested.
  # Coverage is collected only on the default-feature build to keep the
  # all-features job focused on compile+test speed; the `query` feature's
  # bundled DuckDB dominates this job's wall-clock.
  test-all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.3
        with:
          shared-key: test-all-features
      - name: Test (all features)
        run: cargo test --locked --all-features

  build-release:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.3
        with:
          shared-key: build-release
      - name: Build release (default features)
        run: cargo build --locked --release

  build-bins:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.3
        with:
          shared-key: build-bins
      - name: Build bins (all features)
        # `query` is behind the `query` feature, which pulls in bundled DuckDB.
        run: cargo build --locked --all-features --bin gaming-telemetry --bin export_csv --bin query

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - name: Cargo audit (non-blocking)
        # rustsec/audit-check@v1 — pinned; advisory noise must not block capture PRs.
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
