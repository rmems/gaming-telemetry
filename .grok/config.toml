# Project-scoped MCP servers for gaming-telemetry (Rust project)
# This makes these MCPs apply only when working in this repo (e.g. opened in RustRover).
# Higher priority than global ~/.grok/config.toml .
# Use `grok mcp list` or /mcps in TUI (Ctrl+L) to manage/refresh (press r).

[mcp_servers.github]
# GitHub integration (already used for PR #18, issues, reviews)
# Uses your existing auth. For RustRover: when you have the project open in RustRover, these tools are active.
url = "https://api.github.com"  # or proper if using dedicated github mcp; adjust if using stdio npx
# For stdio style (recommended for local):
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }  # set in env or replace

[mcp_servers.memory]
# Memory MCP for persisting prefs (like your GitHub AI PR workflows, Grok Build 0.1 style)
# Scoped here so RustRover sessions on this project remember the "only RustRover" / gaming-telemetry context.
# (already active globally, but listed for visibility)

[mcp_servers.snyk]
# Snyk for Rust scans (SAST, SCA). Useful in RustRover for on-save or build-integrated security.
# command or url as per your setup

# Example for adding a RustRover / JetBrains IDE MCP if you have one
# (e.g. a custom or plugin-provided server that exposes "get open rust file", "trigger cargo build in RustRover", "apply edit in editor")
# [mcp_servers.rustrover]
# command = "/path/to/rustrover-mcp"   # or "npx" + args for any published one
# args = ["--project", "."]
# enabled = true
# description = "RustRover IDE integration - only active for this Rust project when cwd matches"

# Optional: Git for this repo
# [mcp_servers.git]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-git", "."]

# To make "only RustRover": keep global MCPs minimal or disabled for non-Rust work.
# When you open this project in RustRover, the .grok/ here takes precedence.
# Refresh with /mcps then 'r', or restart Grok session.
# See ~/.grok/docs/user-guide/07-mcp-servers.md for full details and `grok mcp doctor`.
