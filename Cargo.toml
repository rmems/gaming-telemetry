[package]
name = "gaming-telemetry"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.98.0"

[workspace]

# Shared home for manifest/timing/session/privacy logic, so the collector and the
# helper binaries use one tested implementation instead of `#[path]` includes.
[lib]
name = "gaming_telemetry"
path = "src/lib.rs"

# A capture session only needs `poll hardware -> buffer -> Parquet`. Analysis
# tooling is opt-in so a default build stays small: `duckdb` with `bundled`
# compiles the whole DuckDB C++ tree, which dominates build time and peak RAM on
# a workstation that is also running the game being measured.
[features]
default = []
query = ["dep:duckdb"]

[[bin]]
name = "query"
path = "src/bin/query.rs"
required-features = ["query"]

[dependencies]
nvml-wrapper = { version = "0.13.0", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
polars = { version = "0.55.2", features = ["parquet", "lazy"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
# `bundled` builds DuckDB from source; `query.rs` only issues plain SQL through
# `Connection`/`row.get`, so the crate's Arrow<->Polars bridge is not needed.
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
fs2 = "0.4.3"
